# MicroDuck A7Z: only emergency kernel messages go to the consoles (serial ttyAS0 at 115200 and tty1).
# At the default console loglevel 4 a driver error flood (2026-10-31 16:33:35: the jammed touch bus, about 100 lines a
# second) is printed line by line to the slow serial console with interrupts off, and the servo UART lost replies.
# Every message still reaches the kernel log, dmesg and the flight recorder (duck-blackbox.service).
# Installed to /etc/sysctl.d/ by install_console_quiet.sh.
kernel.printk = 1 4 1 7
