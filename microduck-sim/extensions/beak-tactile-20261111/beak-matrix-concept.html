<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鸭嘴触觉矩阵示意</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  #canvas { width: 1600px; height: 1060px; }
  svg text { font-family: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif; fill: #1f2933; }
  .h1 { font-size: 26px; font-weight: 700; }
  .sub { font-size: 15px; fill: #52606d; }
  .h2 { font-size: 18px; font-weight: 700; }
  .t { font-size: 14px; }
  .s { font-size: 13px; fill: #3e4c59; }
  .bt { font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div id="canvas">
<svg width="1600" height="1060" viewBox="0 0 1600 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fde68a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d97706" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- title -->
  <text x="40" y="48" class="h1">鸭嘴触觉：一张 FPC 行列矩阵，怎么接到板子上</text>
  <text x="40" y="76" class="sub">做法同 ART-Glove：触点排成行列，线全印在柔性电路板（FPC）里，最后只用一根 4 芯排线进头。示意图，不是 CAD。</text>

  <!-- zones -->
  <rect x="30" y="96" width="850" height="474" rx="12" fill="#f8fafc" stroke="#e4e7eb"/>
  <rect x="30" y="586" width="850" height="300" rx="12" fill="#f8fafc" stroke="#e4e7eb"/>
  <rect x="910" y="96" width="660" height="520" rx="12" fill="#f8fafc" stroke="#e4e7eb"/>
  <rect x="910" y="632" width="660" height="400" rx="12" fill="#f8fafc" stroke="#e4e7eb"/>

  <!-- ===== Panel A: top view ===== -->
  <text x="50" y="126" class="h2">A　上嘴内面（从嘴里往上看），约 84 × 30 mm</text>
  <text x="374" y="148" class="s" text-anchor="middle">前（嘴尖）</text>
  <text x="58" y="252" class="s" text-anchor="middle">机器</text><text x="58" y="270" class="s" text-anchor="middle">人右</text>
  <text x="690" y="252" class="s" text-anchor="middle">机器</text><text x="690" y="270" class="s" text-anchor="middle">人左</text>

  <!-- beak face -->
  <rect x="80" y="156" width="588" height="210" rx="40" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/>

  <!-- left patch -->
  <rect x="94" y="168" width="161" height="168" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <!-- right patch -->
  <rect x="493" y="168" width="161" height="168" rx="6" fill="#ffffff" stroke="#9aa5b1"/>

  <!-- rows (blue) -->
  <g stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="102" y1="189" x2="247" y2="189"/><line x1="102" y1="231" x2="247" y2="231"/>
    <line x1="102" y1="273" x2="247" y2="273"/><line x1="102" y1="315" x2="247" y2="315"/>
    <line x1="501" y1="189" x2="646" y2="189"/><line x1="501" y1="231" x2="646" y2="231"/>
    <line x1="501" y1="273" x2="646" y2="273"/><line x1="501" y1="315" x2="646" y2="315"/>
  </g>
  <!-- columns (orange) -->
  <g stroke="#ea580c" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="114" y1="176" x2="114" y2="328"/><line x1="154" y1="176" x2="154" y2="328"/>
    <line x1="194" y1="176" x2="194" y2="328"/><line x1="235" y1="176" x2="235" y2="328"/>
    <line x1="513" y1="176" x2="513" y2="328"/><line x1="553" y1="176" x2="553" y2="328"/>
    <line x1="594" y1="176" x2="594" y2="328"/><line x1="634" y1="176" x2="634" y2="328"/>
  </g>
  <!-- taxels -->
  <g fill="#111827">
    <circle cx="114" cy="189" r="5"/><circle cx="154" cy="189" r="5"/><circle cx="194" cy="189" r="5"/><circle cx="235" cy="189" r="5"/>
    <circle cx="114" cy="231" r="5"/><circle cx="154" cy="231" r="5"/><circle cx="194" cy="231" r="5"/><circle cx="235" cy="231" r="5"/>
    <circle cx="114" cy="273" r="5"/><circle cx="154" cy="273" r="5"/><circle cx="194" cy="273" r="5"/><circle cx="235" cy="273" r="5"/>
    <circle cx="114" cy="315" r="5"/><circle cx="154" cy="315" r="5"/><circle cx="194" cy="315" r="5"/><circle cx="235" cy="315" r="5"/>
    <circle cx="513" cy="189" r="5"/><circle cx="553" cy="189" r="5"/><circle cx="594" cy="189" r="5"/><circle cx="634" cy="189" r="5"/>
    <circle cx="513" cy="231" r="5"/><circle cx="553" cy="231" r="5"/><circle cx="594" cy="231" r="5"/><circle cx="634" cy="231" r="5"/>
    <circle cx="513" cy="273" r="5"/><circle cx="553" cy="273" r="5"/><circle cx="594" cy="273" r="5"/><circle cx="634" cy="273" r="5"/>
    <circle cx="513" cy="315" r="5"/><circle cx="553" cy="315" r="5"/><circle cx="594" cy="315" r="5"/><circle cx="634" cy="315" r="5"/>
  </g>

  <!-- speaker window -->
  <rect x="269" y="196" width="210" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#cbd2d9" stroke="#6b7280">
    <circle cx="311" cy="222" r="8"/><circle cx="353" cy="222" r="8"/><circle cx="395" cy="222" r="8"/><circle cx="437" cy="222" r="8"/>
    <circle cx="311" cy="248" r="8"/><circle cx="353" cy="248" r="8"/><circle cx="395" cy="248" r="8"/><circle cx="437" cy="248" r="8"/>
    <circle cx="311" cy="274" r="8"/><circle cx="353" cy="274" r="8"/><circle cx="395" cy="274" r="8"/><circle cx="437" cy="274" r="8"/>
  </g>
  <text x="374" y="186" class="s" text-anchor="middle">FPC 在出声孔处挖窗</text>

  <!-- bundles to tail -->
  <path d="M175,336 V350 H352 V366" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <path d="M574,336 V350 H396 V366" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <text x="262" y="346" class="s">8 根</text>
  <text x="460" y="346" class="s" text-anchor="end">8 根</text>
  <text x="175" y="392" class="t" text-anchor="middle">一片 4 行 × 4 列 = 16 点</text>
  <text x="574" y="392" class="t" text-anchor="middle">另一片 4 行 × 4 列 = 16 点</text>

  <!-- tail -->
  <rect x="344" y="366" width="60" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="319" y="410" width="110" height="56" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="331" y="420" width="38" height="36" rx="3" fill="#374151"/>
  <rect x="379" y="420" width="38" height="36" rx="3" fill="#374151"/>
  <text x="350" y="443" class="s" text-anchor="middle" style="fill:#ffffff">IO</text>
  <text x="398" y="443" class="s" text-anchor="middle" style="fill:#ffffff">ADC</text>
  <line x1="374" y1="466" x2="374" y2="540" stroke="#7c3aed" stroke-width="5" marker-end="url(#ahp)"/>

  <!-- tail callouts -->
  <polyline points="404,402 444,420 456,420" fill="none" stroke="#9aa5b1"/>
  <text x="462" y="424" class="s">尾巴：两片的同号行在这里并联，</text>
  <text x="462" y="442" class="s">共 4 行 + 8 列 = 12 根线，都在 FPC 里</text>
  <polyline points="429,458 444,470 456,470" fill="none" stroke="#9aa5b1"/>
  <text x="462" y="474" class="s">加强板上贴 2 颗读数芯片 + 8 个下拉电阻</text>
  <text x="462" y="492" class="s">（FPC 厂可以直接贴片）</text>
  <text x="396" y="522" class="t">4 芯排线（FFC）：3V3 · GND · SDA · SCL</text>
  <text x="396" y="542" class="s">穿过上嘴底板上的打印槽进头，接 XIAO（见 C）</text>
  <text x="50" y="556" class="s">后（往头里）↓</text>

  <!-- ===== Panel B: cross-section ===== -->
  <text x="50" y="616" class="h2">B　截面：一个触点从上到下的层（厚度为估计）</text>
  <rect x="80" y="636" width="460" height="40" fill="url(#hatch)" stroke="#d97706"/>
  <rect x="80" y="676" width="460" height="9" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="80" y="685" width="460" height="14" fill="#c4b5fd" stroke="#7c3aed"/>
  <rect x="80" y="699" width="460" height="10" fill="#374151"/>
  <rect x="80" y="709" width="460" height="10" fill="#fef3c7" stroke="#d4a72c"/>

  <g stroke="#9aa5b1">
    <line x1="540" y1="656" x2="580" y2="650"/>
    <line x1="540" y1="680" x2="580" y2="678"/>
    <line x1="540" y1="692" x2="580" y2="706"/>
    <line x1="540" y1="704" x2="580" y2="734"/>
    <line x1="540" y1="714" x2="580" y2="762"/>
  </g>
  <text x="586" y="655" class="s">上嘴 PLA 底板（头壳的一部分，不动）</text>
  <text x="586" y="683" class="s">3M 双面胶：把 FPC 贴上去</text>
  <text x="586" y="711" class="s">FPC：行、列两层铜，交叉处做成叉指</text>
  <text x="586" y="739" class="s">压阻膜（Velostat）：压哪里，哪里电阻变小</text>
  <text x="586" y="767" class="s">覆盖层：薄胶带或 0.4 mm 打印片</text>

  <ellipse cx="310" cy="770" rx="58" ry="22" fill="#fdba74" stroke="#c2410c"/>
  <text x="310" y="775" class="s" text-anchor="middle">被夹的东西</text>
  <line x1="310" y1="746" x2="310" y2="724" stroke="#52606d" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M120,846 L500,846 L500,826 L170,812 Z" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="310" y="870" class="s" text-anchor="middle">下颚（会动，ID15）把东西往上压；下颚不贴传感器，所以没有线跨过铰链</text>

  <!-- ===== legend + notes ===== -->
  <text x="40" y="914" class="h2">图例</text>
  <line x1="40" y1="936" x2="70" y2="936" stroke="#2563eb" stroke-width="7" opacity="0.85"/>
  <text x="78" y="941" class="s">行电极</text>
  <line x1="150" y1="936" x2="180" y2="936" stroke="#ea580c" stroke-width="7" opacity="0.8"/>
  <text x="188" y="941" class="s">列电极</text>
  <circle cx="268" cy="936" r="5" fill="#111827"/>
  <text x="280" y="941" class="s">触点（行列交叉）</text>
  <line x1="400" y1="936" x2="430" y2="936" stroke="#7c3aed" stroke-width="5"/>
  <text x="438" y="941" class="s">新加的线（在 FPC 或排线里）</text>
  <line x1="640" y1="936" x2="670" y2="936" stroke="#15803d" stroke-width="5"/>
  <text x="678" y="941" class="s">已有的线</text>
  <rect x="40" y="950" width="22" height="12" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="70" y="961" class="s">紫色填充 = FPC 本体；C 里紫框 = 新做的部分，绿框 = 已有的板</text>
  <text x="40" y="984" class="s">尺寸来自 10/26 CAD 测量：上嘴内面约 84 × 30 mm，出声孔左右 ±15 mm；孔的前后位置是示意。</text>
  <text x="40" y="1004" class="s">芯片型号是候选，未做选型和购买核查。排线进头的槽要改模型重印，不在现有零件上开。</text>
  <text x="40" y="1024" class="s">参考：ART-Glove（Changyi Lin, Ding Zhao, arXiv 2606.16370）的行列 FPC 与 FFC 上走 I2C 的做法。</text>

  <!-- ===== Panel C: signal chain ===== -->
  <text x="930" y="126" class="h2">C　信号怎么走到大脑</text>

  <rect x="940" y="142" width="600" height="72" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="960" y="172" class="bt">① 32 个触点（4 行 × 8 列）</text>
  <text x="960" y="198" class="t">线都印在 FPC 里，手上不接线</text>

  <line x1="1240" y1="214" x2="1240" y2="262" stroke="#7c3aed" stroke-width="3" marker-end="url(#ahp)"/>
  <text x="1254" y="243" class="s">FPC 内 12 根走线</text>

  <rect x="940" y="264" width="600" height="72" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="960" y="294" class="bt">② FPC 尾巴上的 2 颗读数芯片</text>
  <text x="960" y="320" class="t">IO 扩展（如 TCA9534）选中一行；8 路 ADC（如 ADS7138）读 8 列</text>

  <line x1="1240" y1="336" x2="1240" y2="384" stroke="#7c3aed" stroke-width="3" marker-end="url(#ahp)"/>
  <text x="1254" y="365" class="s">4 芯 FFC：3V3 · GND · SDA · SCL</text>

  <rect x="940" y="386" width="600" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="960" y="416" class="bt">③ XIAO ESP32-S3（已在头里左后）</text>
  <text x="960" y="442" class="t">空着的 D9/D10 当第二路 I2C 读矩阵；D0–D3、D8 照旧读摸头铜箔</text>

  <line x1="1240" y1="458" x2="1240" y2="506" stroke="#15803d" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="1254" y="487" class="s">已有 4 根线：D4/D5 → A7Z 针 29/31，不加线</text>

  <rect x="940" y="508" width="600" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="960" y="538" class="bt">④ A7Z 大脑</text>
  <text x="960" y="564" class="t">像读摸头一样读一块数据，块里多出 32 个压力值</text>

  <!-- ===== Panel D: scan ===== -->
  <text x="930" y="662" class="h2">D　读一遍矩阵：一次选一行</text>
  <!-- grid -->
  <rect x="950" y="738" width="300" height="34" fill="#dbeafe"/>
  <g stroke="#2563eb" stroke-width="6" opacity="0.85" stroke-linecap="round">
    <line x1="960" y1="713" x2="1240" y2="713"/><line x1="960" y1="755" x2="1240" y2="755"/>
    <line x1="960" y1="797" x2="1240" y2="797"/><line x1="960" y1="839" x2="1240" y2="839"/>
  </g>
  <g stroke="#ea580c" stroke-width="6" opacity="0.8" stroke-linecap="round">
    <line x1="975" y1="696" x2="975" y2="856"/><line x1="1013" y1="696" x2="1013" y2="856"/>
    <line x1="1051" y1="696" x2="1051" y2="856"/><line x1="1089" y1="696" x2="1089" y2="856"/>
    <line x1="1127" y1="696" x2="1127" y2="856"/><line x1="1165" y1="696" x2="1165" y2="856"/>
    <line x1="1203" y1="696" x2="1203" y2="856"/><line x1="1241" y1="696" x2="1241" y2="856"/>
  </g>
  <circle cx="1089" cy="755" r="9" fill="#dc2626"/>
  <text x="1262" y="718" class="s">0 V</text>
  <text x="1262" y="760" class="s" style="font-weight:700;fill:#1d4ed8">3.3 V ← 选中</text>
  <text x="1262" y="802" class="s">0 V</text>
  <text x="1262" y="844" class="s">0 V</text>
  <text x="1098" y="886" class="s" text-anchor="middle">8 列同时进 ADC ↓</text>

  <text x="1380" y="718" class="s">1. 选中的行接 3.3 V，</text>
  <text x="1380" y="738" class="s">　 其余 3 行接地</text>
  <text x="1380" y="766" class="s">2. 8 列同时读电压：</text>
  <text x="1380" y="786" class="s">　 红点被压，那一列电压高</text>
  <text x="1380" y="814" class="s">3. 换下一行，4 行轮完</text>
  <text x="1380" y="834" class="s">　 = 32 个点一帧</text>

  <!-- taxel inset -->
  <rect x="950" y="910" width="150" height="96" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <g stroke="#2563eb" stroke-width="4">
    <line x1="966" y1="922" x2="966" y2="994"/>
    <line x1="966" y1="926" x2="1066" y2="926"/>
    <line x1="966" y1="958" x2="1066" y2="958"/>
    <line x1="966" y1="990" x2="1066" y2="990"/>
  </g>
  <g stroke="#ea580c" stroke-width="4">
    <line x1="1084" y1="922" x2="1084" y2="994"/>
    <line x1="984" y1="942" x2="1084" y2="942"/>
    <line x1="984" y1="974" x2="1084" y2="974"/>
  </g>
  <text x="1116" y="934" class="s">放大一个触点：行梳（蓝）和列梳（橙）交错，</text>
  <text x="1116" y="954" class="s">互不相连。压阻膜被压下去，把两把梳子</text>
  <text x="1116" y="974" class="s">连起来，压得越重，电阻越小。</text>
  <text x="1116" y="1002" class="s">未选中的行接地，用来减少串扰（鬼影）。</text>
</svg>
</div>
</body>
</html>
