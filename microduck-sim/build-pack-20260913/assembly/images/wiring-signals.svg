<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang SC,Arial,sans-serif"><text x="65" y="75" font-size="40" fill="#132b43">Wiring B · DATA bus and Pi pin assignments</text><text x="65" y="126" font-size="23" fill="#50647b">Pin numbers are logical assignments, not connector viewing directions. Verify manufacturer pinout and continuity.</text><rect x="65" y="200" width="470" height="110" rx="14" fill="#e3f0e9" stroke="#c0ceda"/><text x="85" y="234" font-size="25" fill="#132b43">Pi 3 / Pi Zero (gen 1)</text><text x="85" y="268" font-size="19" fill="#50647b">Zero baseline; board unverified</text><polyline points="535,245 730,245" fill="none" stroke="#3389b7" stroke-width="4" marker-end="url(#arr)"/><rect x="730" y="200" width="360" height="110" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="750" y="234" font-size="25" fill="#132b43">OpenRB-150</text><text x="750" y="268" font-size="19" fill="#50647b">USB-C powers board logic only</text><text x="570" y="220" font-size="21" fill="#3389b7">USB data cable</text><text x="1130" y="228" font-size="23" fill="#132b43">DXL: Pin1 → common ground</text><text x="1130" y="266" font-size="23" fill="#b74b34">Pin2 VDD → remove terminal; insulate</text><text x="1130" y="304" font-size="23" fill="#132b43">Pin3 DATA → shared bus below</text><polyline points="910,310 910,370 125,370 125,440" fill="none" stroke="#d99825" stroke-width="4"/><rect x="65" y="440" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="85" y="474" font-size="25" fill="#132b43">ID 15</text><text x="85" y="508" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="300,480 403,480" fill="none" stroke="#d99825" stroke-width="4"/><rect x="403" y="440" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="423" y="474" font-size="25" fill="#132b43">ID 14</text><text x="423" y="508" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="638,480 741,480" fill="none" stroke="#d99825" stroke-width="4"/><rect x="741" y="440" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="761" y="474" font-size="25" fill="#132b43">ID 13</text><text x="761" y="508" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="976,480 1079,480" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1079" y="440" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1099" y="474" font-size="25" fill="#132b43">ID 11</text><text x="1099" y="508" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="1314,480 1417,480" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1417" y="440" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1437" y="474" font-size="25" fill="#132b43">ID 12</text><text x="1437" y="508" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="1652,480 1692,480 1692,550 40,550 40,625 65,625" fill="none" stroke="#d99825" stroke-width="4"/><rect x="65" y="585" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="85" y="619" font-size="25" fill="#132b43">ID 10</text><text x="85" y="653" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="300,625 403,625" fill="none" stroke="#d99825" stroke-width="4"/><rect x="403" y="585" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="423" y="619" font-size="25" fill="#132b43">ID 5</text><text x="423" y="653" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="638,625 741,625" fill="none" stroke="#d99825" stroke-width="4"/><rect x="741" y="585" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="761" y="619" font-size="25" fill="#132b43">ID 4</text><text x="761" y="653" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="976,625 1079,625" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1079" y="585" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1099" y="619" font-size="25" fill="#132b43">ID 3</text><text x="1099" y="653" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="1314,625 1417,625" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1417" y="585" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1437" y="619" font-size="25" fill="#132b43">ID 2</text><text x="1437" y="653" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="1652,625 1692,625 1692,695 40,695 40,770 65,770" fill="none" stroke="#d99825" stroke-width="4"/><rect x="65" y="730" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="85" y="764" font-size="25" fill="#132b43">ID 1</text><text x="85" y="798" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="300,770 403,770" fill="none" stroke="#d99825" stroke-width="4"/><rect x="403" y="730" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="423" y="764" font-size="25" fill="#132b43">ID 6</text><text x="423" y="798" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="638,770 741,770" fill="none" stroke="#d99825" stroke-width="4"/><rect x="741" y="730" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="761" y="764" font-size="25" fill="#132b43">ID 7</text><text x="761" y="798" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="976,770 1079,770" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1079" y="730" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1099" y="764" font-size="25" fill="#132b43">ID 8</text><text x="1099" y="798" font-size="19" fill="#50647b">Pin3 DATA</text><polyline points="1314,770 1417,770" fill="none" stroke="#d99825" stroke-width="4"/><rect x="1417" y="730" width="235" height="80" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="1437" y="764" font-size="25" fill="#132b43">ID 9</text><text x="1437" y="798" font-size="19" fill="#50647b">Pin3 DATA</text><text x="65" y="880" font-size="24" fill="#132b43">One DATA wire: commands and replies alternate; servos respond by ID, without forwarding.</text><text x="65" y="923" font-size="26" fill="#132b43">Each input also gets its own Pin1 GND and Pin2 5V. The next-servo output retains Pin3 only.</text><text x="65" y="968" font-size="22" fill="#50647b">Order is a routing candidate, not a requirement. Power groups remain as in A; do not daisy-chain servo power.</text><rect x="65" y="1010" width="790" height="310" rx="14" fill="#eee3f2" stroke="#c0ceda"/><text x="85" y="1044" font-size="25" fill="#132b43">Pi → MAX98357A amplifier / I²S audio</text><text x="90" y="1088" font-size="24" fill="#132b43">Physical12 / GPIO18 → BCLK</text><text x="90" y="1131" font-size="24" fill="#132b43">Physical35 / GPIO19 → LRC</text><text x="90" y="1174" font-size="24" fill="#132b43">Physical40 / GPIO21 → DIN</text><text x="90" y="1217" font-size="24" fill="#132b43">VIN → logic 5V after F10; GND → logic ground</text><text x="90" y="1260" font-size="24" fill="#132b43">OUT+/OUT− → speaker; neither output is ground</text><rect x="915" y="1010" width="815" height="310" rx="14" fill="#dff1f0" stroke="#c0ceda"/><text x="935" y="1044" font-size="25" fill="#132b43">Pi → BNO085 orientation sensor / I²C</text><text x="940" y="1088" font-size="24" fill="#132b43">Physical1 / 3.3V → VIN</text><text x="940" y="1131" font-size="24" fill="#132b43">Physical6 / GND → GND</text><text x="940" y="1174" font-size="24" fill="#132b43">Physical3 / GPIO2 → SDA</text><text x="940" y="1217" font-size="24" fill="#132b43">Physical5 / GPIO3 → SCL</text><text x="940" y="1260" font-size="24" fill="#132b43">STEMMA QT cable; 3Vo is not VIN</text><text x="65" y="1390" font-size="26" fill="#132b43">Zero reference CSI: 22-pin ↔ 15-to-22 cable ↔ camera. Confirm selected Pi connector first.</text><text x="65" y="1440" font-size="25" fill="#50647b">The alarm uses the battery balance port; it is separate from the I²S duck-call speaker.</text></g></svg>