330" height="60" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="870" y="1146" font-size="25" fill="#132b43">ID 8 Left hip pitch</text><polyline points="825,1142 825,1179 1220,1179 1220,1142 1260,1142" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="1260" y="1112" width="330" height="60" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="1280" y="1146" font-size="25" fill="#132b43">ID 9 Left hip roll</text><text x="70" y="1146" font-size="21" fill="#50647b">Power group 5</text><rect x="465" y="1195" width="230" height="60" rx="14" fill="#ffe3d7" stroke="#c0ceda"/><text x="485" y="1229" font-size="25" fill="#132b43">F6 · 3A</text><polyline points="410,1225 465,1225" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><polyline points="695,1225 840,1225" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><text x="717" y="1218" font-size="18" fill="#132b43">20AWG</text><rect x="850" y="1195" width="330" height="60" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="870" y="1229" font-size="25" fill="#132b43">ID 11 Head pitch</text><polyline points="825,1225 825,1262 1220,1262 1220,1225 1260,1225" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="1260" y="1195" width="330" height="60" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="1280" y="1229" font-size="25" fill="#132b43">ID 12 Neck pitch</text><text x="70" y="1229" font-size="21" fill="#50647b">Power group 6</text><rect x="465" y="1278" width="230" height="60" rx="14" fill="#ffe3d7" stroke="#c0ceda"/><text x="485" y="1312" font-size="25" fill="#132b43">F7 · 3A</text><polyline points="410,1308 465,1308" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><polyline points="695,1308 840,1308" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><text x="717" y="1301" font-size="18" fill="#132b43">20AWG</text><rect x="850" y="1278" width="330" height="60" rx="14" fill="#e0edf5" stroke="#