<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1610" viewBox="0 0 1800 1610"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang SC,Arial,sans-serif"><text x="65" y="75" font-size="40" fill="#132b43">Wiring A · Eight fused groups, 15 independent servo feeds</text><text x="65" y="126" font-size="23" fill="#50647b">Electrical diagram: red = positive, black = common ground. Follow WIRING.md; flexible cable routes are not validated.</text><rect x="60" y="190" width="330" height="90" rx="14" fill="#fff0cb" stroke="#c0ceda"/><text x="80" y="224" font-size="25" fill="#132b43">2S battery / EC2</text><text x="80" y="258" font-size="19" fill="#50647b">Main disconnect: EC2</text><polyline points="390,220 500,220" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="500" y="180" width="290" height="85" rx="14" fill="#ffe3d7" stroke="#c0ceda"/><text x="520" y="214" font-size="25" fill="#132b43">F0 · 10A</text><text x="520" y="248" font-size="19" fill="#50647b">Near battery positive entry</text><polyline points="790,220 850,220 850,360 410,360 410,400" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="400" width="680" height="95" rx="14" fill="#e7eff5" stroke="#c0ceda"/><text x="90" y="434" font-size="25" fill="#132b43">D42V110F5 · Servo 5V</text><text x="90" y="468" font-size="19" fill="#50647b">VIN in; VOUT to servos only. Never join the two VOUT rails.</text><polyline points="850,220 850,430 970,430" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="970" y="395" width="250" height="85" rx="14" fill="#ffe3d7" stroke="#c0ceda"/><text x="990" y="429" font-size="25" fill="#132b43">F9 · 3A</text><text x="990" y="463" font-size="19" fill="#50647b">Logic regulator VIN</text><polyline points="1220,438 1280,438" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="1280" y="395" width="360" height="85" rx="14" fill="#e7eff5" stroke="#c0ceda"/><text x="1300" y="429" font-size="25" fill="#132b43">S13V30F5 · Logic 5V</text><text x="1300" y="463" font-size="19" fill="#50647b">Pi / OpenRB / audio</text><polyline points="1640,438 1690,438 1690,542 1240,542" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="970" y="508" width="270" height="85" rx="14" fill="#e7eff5" stroke="#c0ceda"/><text x="990" y="542" font-size="25" fill="#132b43">Pi PWR IN</text><text x="990" y="576" font-size="19" fill="#50647b">20AWG≤200mm</text><polyline points="1690,542 1690,655 1510,655" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><rect x="1190" y="617" width="320" height="85" rx="14" fill="#eee3f2" stroke="#c0ceda"/><text x="1210" y="651" font-size="25" fill="#132b43">F10 · 0.5A → Amp</text><text x="1210" y="685" font-size="19" fill="#50647b">Protects the audio branch</text><polyline points="650,495 650,545" fill="none" stroke="#3389b7" stroke-width="4" marker-end="url(#arr)"/><rect x="455" y="545" width="460" height="115" rx="14" fill="#e0edf5" stroke="#c0ceda"/><text x="475" y="579" font-size="25" fill="#132b43">Servo switch: ENA / GND</text><text x="475" y="613" font-size="19" fill="#50647b">Center to ENA; one outer pin to GND.</text><text x="475" y="642" font-size="19" fill="#132b43">Leave ENB, PFM and PG open.</text><polyline points="410,495 410,1432" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><text x="70" y="730" font-size="27" fill="#132b43">Servo 5V positive star</text><rect x="465" y="780" width="230" height="60" rx="14" fill="#ffe3d7" stroke="#c0ceda"/><text x="485" y="814" font-size="25" fill="#132b43">F1 · 3A</text><polyline points="410,810 465,810" fill="none" stroke="#de654c" stroke-width="4" marker-end="url(#arr)"/><polyline points="695,810 840,810" fill="none" stroke="#