<text x="520" y="171" font-size="15" fill="#293845">绿：唯一 5991 放到自带线出口附近</text>
<text x="520" y="204" font-size="15" fill="#293845">橙：自带 USB-C → 5991（长度待实物摆线）</text>
<text x="520" y="250" font-size="15" fill="#293845">红：髋俯仰 +30°，原机器人此姿态无所测源碰撞</text>
<text x="520" y="278" font-size="15" fill="#293845">现低背托与小腿相交 17.18 mm³</text>
<text x="520" y="306" font-size="15" fill="#293845">电池后移 20 mm，仍有 6 条源基线清楚姿态的新碰撞</text>
<text x="520" y="334" font-size="15" fill="#293845">不能据此限制原关节范围或直接打印</text>
<text x="520" y="390" font-size="15" fill="#293845">两端不做窄插头孔；底部 USB-C/A 均保留开放入口</text>
<text x="520" y="418" font-size="15" fill="#293845">备用：底部 USB-C 另接线到同一 5991</text>
<text x="520" y="446" font-size="15" fill="#293845">墙充与充电宝二选一；ISET 配置也须相应切换</text>
<text x="520" y="474" font-size="15" fill="#293845">5991 的托/绑带最终固定未完成，绿色只是接收位置</text>
<text x="520" y="540" font-size="15" fill="#293845">完整范围：左右 yaw/roll/pitch 各13点 + 27组合/侧</text>
<text x="520" y="568" font-size="15" fill="#293845">去重133姿态：32有源碰撞，101未发现这些源碰撞</text>
<text x="520" y="596" font-size="15" fill="#293845">无实物承重、重心、动态步态或供电验收</text>
