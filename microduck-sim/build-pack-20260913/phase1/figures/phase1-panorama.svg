<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1200" viewBox="0 0 1340 1200"><style>text{font-family:Arial,sans-serif;fill:#172c36}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#55707c}.head{font-size:21px;font-weight:700}.body{font-size:18px}.tiny{font-size:16px} .box{fill:#fff;stroke:#c9d7dc;stroke-width:2}</style><rect width="1340" height="1200" fill="#f4f7f8"/><text x="40" y="55" class="title">Phase 1: supervised walking and pickup</text><text x="40" y="89" class="sub">External power stays at the bench. Camera, sound and onboard battery come in Phase 2.</text><rect class="box" x="480" y="125" width="365" height="140" rx="14"/><text x="500" y="159" class="head">Existing 5V source</text><text x="500" y="193" class="body">Your USB-C power bank</text><text x="500" y="220" class="body">Dedicated compact Pi power cable</text><rect class="box" x="40" y="360" width="330" height="140" rx="14"/><text x="60" y="394" class="head">MacBook</text><text x="60" y="428" class="body">Keyboard control over Wi-Fi</text><text x="60" y="455" class="body">Operator watches the robot</text><rect class="box" x="480" y="360" width="365" height="140" rx="14"/><text x="500" y="394" class="head">Borrowed Raspberry Pi Zero 2 W</text><text x="500" y="428" class="body">Runs walking and pickup commands</text><text x="500" y="455" class="body">Reads body orientation</text><rect class="box" x="955" y="360" width="345" height="140" rx="14"/><text x="975" y="394" class="head">OpenRB-150</text><text x="975" y="428" class="body">USB → DYNAMIXEL communication</text><text x="975" y="455" class="body">Logic powered through USB</text><path d="M663 265 L663 360" fill="none" stroke="#ce6d32" stroke-width="3"/><path d="M657 351 L663 360 L669 351" fill="none" stroke="#ce6d32" stroke-width="3"/><text x="681" y="313" class="tiny">5V power</text><path d="M370 425 L480 425" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M471 419 L480 425 L471 431" fill="none" stroke="#216ca3" stroke-width="3"/><text x="391" y="407" class="tiny">Wi-Fi</text><path d="M845 425 L955 425" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M946 419 L955 425 L946 431" fill="none" stroke="#216ca3" stroke-width="3"/><text x="867" y="407" class="tiny">USB</text><rect class="box" x="40" y="590" width="330" height="150" rx="14"/><text x="60" y="624" class="head">5V / 6A enclosed supply</text><text x="60" y="658" class="body">Mean Well GST60A05-P1J</text><text x="60" y="685" class="body">Borrow a grounded wall cord</text><text x="60" y="712" class="body">Unplug 5V cable to stop motors</text><rect class="box" x="480" y="590" width="365" height="150" rx="14"/><text x="500" y="624" class="head">BNO085 orientation sensor</text><text x="500" y="658" class="body">IMU = inertial measurement unit</text><text x="500" y="685" class="body">I2C carries sensor readings</text><path d="M663 590 L663 500" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M657 509 L663 500 L669 509" fill="none" stroke="#216ca3" stroke-width="3"/><rect class="box" x="955" y="590" width="345" height="150" rx="14"/><text x="975" y="624" class="head">15 smart servos</text><text x="975" y="658" class="body">14 body/head + 1 jaw (ID 15)</text><text x="975" y="685" class="body">Individual power feeds</text><path d="M1127 500 L1127 590" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M1121 581 L1127 590 L1133 581" fill="none" stroke="#216ca3" stroke-width="3"/><text x="1145" y="542" class="tiny">Commands</text><text x="1145" y="564" class="tiny">+ return (GND)</text><rect class="box" x="40" y="830" width="330" height="150" rx="14"/><text x="60" y="864" class="head">Fused power distribution</text><text x="60" y="898" class="body">1 main fuse + 8 branch fuses</text><text x="60" y="925" class="body">15 individual motor power tails</text><text x="60" y="952" class="body">Motor power bypasses OpenRB</text><path d="M205 740 L205 830" fill="none" stroke="#ce6d32" stroke-width="3"/><path d="M199 821 L205 830 L211 821" fill="none" stroke="#ce6d32" stroke-width="3"/><path d="M370 900 L1127 900" fill="none" stroke="#ce6d32" stroke-width="3"/><path d="M1127 900 L1127 740" fill="none" stroke="#ce6d32" stroke-width="3"/><path d="M1121 749 L1127 740 L1133 749" fill="none" stroke="#ce6d32" stroke-width="3"/><text x="600" y="881" class="tiny">5V motor power + return</text><text x="40" y="1038" class="head">Acceptance path</text><rect class="box" x="40" y="1070" width="294" height="70" rx="14"/><text x="60" y="1104" class="head">Inspect + configure</text><rect class="box" x="362" y="1070" width="294" height="70" rx="14"/><text x="382" y="1104" class="head">Supported motion</text><rect class="box" x="684" y="1070" width="294" height="70" rx="14"/><text x="704" y="1104" class="head">Walk + stop</text><rect class="box" x="1006" y="1070" width="294" height="70" rx="14"/><text x="1026" y="1104" class="head">Approach + pickup</text><path d="M334 1105 L362 1105" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M353 1099 L362 1105 L353 1111" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M656 1105 L684 1105" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M675 1099 L684 1105 L675 1111" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M978 1105 L1006 1105" fill="none" stroke="#216ca3" stroke-width="3"/><path d="M997 1099 L1006 1105 L997 1111" fill="none" stroke="#216ca3" stroke-width="3"/></svg>