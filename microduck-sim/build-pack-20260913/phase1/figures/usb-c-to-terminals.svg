<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="850" viewBox="0 0 1260 850"><style>text{font-family:Arial,sans-serif;fill:#172c36}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#55707c}.head{font-size:21px;font-weight:700}.body{font-size:18px}.tiny{font-size:16px} .box{fill:#fff;stroke:#c9d7dc;stroke-width:2}</style><rect width="1260" height="850" fill="#f4f7f8"/><text x="40" y="55" class="title">How USB-C reaches a screw terminal</text><text x="40" y="88" class="sub">Connection example for a limited single-servo bench test. Not the full-duck power supply.</text><rect class="box" x="40" y="130" width="245" height="185" rx="14"/><text x="60" y="164" class="head">Your power bank</text><text x="60" y="198" class="body">USB-C socket</text><text x="60" y="225" class="body">5V / 3A output</text><rect class="box" x="395" y="130" width="430" height="185" rx="14"/><text x="415" y="164" class="head">USB power breakout board</text><text x="415" y="198" class="body">USB-C socket on the left</text><text x="415" y="225" class="body">Two screw terminals on the right</text><text x="415" y="252" class="body">Example: Adafruit #5991, set to 5V</text><rect class="box" x="965" y="130" width="255" height="185" rx="14"/><text x="985" y="164" class="head">OpenRB input</text><text x="985" y="198" class="body">Terminal marked VIN</text><text x="985" y="225" class="body">Terminal marked GND</text><path d="M285 235 L360 235" fill="none" stroke="#4a5963" stroke-width="12"/><rect x="350" y="217" width="45" height="36" rx="10" fill="#8999a2"/><text x="294" y="279" class="tiny">USB-C cable</text><path d="M825 220 L965 220" fill="none" stroke="#cb5050" stroke-width="5"/><path d="M825 253 L965 253" fill="none" stroke="#333b44" stroke-width="5"/><text x="836" y="207" class="tiny">5V / +</text><text x="836" y="279" class="tiny">GND / −</text><text x="40" y="365" class="head">The screw clamps the wire; it does not touch the USB-C plug.</text><rect class="box" x="40" y="400" width="370" height="335" rx="14"/><text x="60" y="434" class="head">1  Prepare the wire</text><text x="60" y="468" class="body">Remove a short length of insulation.</text><text x="60" y="495" class="body">Keep the metal strands together.</text><rect class="box" x="445" y="400" width="370" height="335" rx="14"/><text x="465" y="434" class="head">2  Insert the metal end</text><text x="465" y="468" class="body">Loosen the terminal screw.</text><text x="465" y="495" class="body">Put the exposed metal under its clamp.</text><rect class="box" x="850" y="400" width="370" height="335" rx="14"/><text x="870" y="434" class="head">3  Tighten and inspect</text><text x="870" y="468" class="body">Tighten the screw; gently tug the wire.</text><text x="870" y="495" class="body">No loose metal or exposed strands.</text><path d="M90 595 L280 595" fill="none" stroke="#cb5050" stroke-width="20"/><path d="M280 595 L345 595" fill="none" stroke="#bd8540" stroke-width="10"/><text x="90" y="657" class="tiny">Insulation</text><text x="264" y="689" class="tiny">Metal conductor</text><rect x="510" y="536" width="230" height="112" rx="6" fill="#4f9d88"/><rect x="540" y="573" width="170" height="53" fill="#314e48"/><rect x="609" y="513" width="25" height="62" fill="#929da3"/><path d="M604 513 L640 513" fill="none" stroke="#64747d" stroke-width="10"/><rect x="915" y="536" width="230" height="112" rx="6" fill="#4f9d88"/><rect x="945" y="573" width="170" height="53" fill="#314e48"/><rect x="1014" y="513" width="25" height="62" fill="#929da3"/><path d="M1009 513 L1045 513" fill="none" stroke="#64747d" stroke-width="10"/><path d="M460 613 L602 613" fill="none" stroke="#bd8540" stroke-width="7"/><path d="M455 613 L540 613" fill="none" stroke="#cb5050" stroke-width="15"/><rect x="595" y="565" width="58" height="12" fill="#c2c9cc"/><path d="M867 613 L1050 613" fill="none" stroke="#bd8540" stroke-width="7"/><path d="M862 613 L956 613" fill="none" stroke="#cb5050" stroke-width="15"/><rect x="1000" y="600" width="58" height="12" fill="#c2c9cc"/><rect x="1014" y="570" width="25" height="30" fill="#929da3"/><text x="473" y="687" class="tiny">Cutaway: open clamp</text><text x="907" y="687" class="tiny">Cutaway: wire clamped</text><text x="40" y="790" class="sub">Disconnect power before wiring. Follow the actual board labels; this drawing is conceptual, not a pinout.</text><text x="40" y="820" class="sub">#5991: 5V switch ON, all others OFF. All switches OFF can request up to 20V.</text></svg>