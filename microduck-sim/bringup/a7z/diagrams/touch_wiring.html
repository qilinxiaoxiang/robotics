<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>触摸板接线</title>
<style>
  html,body{margin:0;background:#fff}
  #canvas{width:640px;height:560px;position:relative}
  svg{position:absolute;left:0;top:0}
  .dim text{fill:#9e9e9e}
  text{font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;fill:#1b1b1b}
</style></head><body><div id="canvas">
<!-- XIAO ESP32-S3 (left) to the A7Z header's inner row, pins 15..33 (right). As soldered 2026-10-20:
     red 3V3 -> 17, black GND -> 25, blue D5 (SCL) -> 29, green D4 (SDA) -> 31. Pin pitch 44 px, pin 15 at y 110. -->
<svg width="640" height="560" viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg">
  <text x="115" y="44" text-anchor="middle" font-size="30" font-weight="700">XIAO</text>
  <text x="540" y="44" text-anchor="middle" font-size="30" font-weight="700">A7Z</text>
  <text x="540" y="74" text-anchor="middle" font-size="24" fill="#4a5a63">里排</text>

  <rect x="20" y="90" width="190" height="450" rx="16" fill="#263238"/>
  <rect x="470" y="90" width="140" height="450" rx="10" fill="#1b1b1b"/>

  <g font-size="26" class="dim">
    <circle cx="500" cy="110" r="9" fill="#616161"/><text x="524" y="118">15</text>
    <circle cx="500" cy="198" r="9" fill="#616161"/><text x="524" y="206">19</text>
    <circle cx="500" cy="242" r="9" fill="#616161"/><text x="524" y="250">21</text>
    <circle cx="500" cy="286" r="9" fill="#616161"/><text x="524" y="294">23</text>
    <circle cx="500" cy="374" r="9" fill="#616161"/><text x="524" y="382">27</text>
    <circle cx="500" cy="506" r="9" fill="#616161"/><text x="524" y="514">33</text>
  </g>

  <g stroke-width="12" stroke-linecap="round">
    <line x1="210" y1="154" x2="500" y2="154" stroke="#d7263d"/>
    <line x1="210" y1="330" x2="500" y2="330" stroke="#1d1d1f"/>
    <line x1="210" y1="418" x2="500" y2="418" stroke="#1f6fd1"/>
    <line x1="210" y1="462" x2="500" y2="462" stroke="#1f9d55"/>
  </g>
  <g font-size="28" font-weight="700" style="fill:#fff">
    <rect x="166" y="138" width="44" height="32" rx="6" fill="#d4a017"/><text x="152" y="164" text-anchor="end" style="fill:#fff">3V3</text>
    <rect x="166" y="314" width="44" height="32" rx="6" fill="#d4a017"/><text x="152" y="340" text-anchor="end" style="fill:#fff">GND</text>
    <rect x="166" y="402" width="44" height="32" rx="6" fill="#d4a017"/><text x="152" y="428" text-anchor="end" style="fill:#fff">D5</text>
    <rect x="166" y="446" width="44" height="32" rx="6" fill="#d4a017"/><text x="152" y="472" text-anchor="end" style="fill:#fff">D4</text>
  </g>
  <g font-size="28" font-weight="700">
    <circle cx="500" cy="154" r="14" fill="#ffd54f" stroke="#fff" stroke-width="3"/><text x="524" y="164" style="fill:#fff">17</text>
    <circle cx="500" cy="330" r="14" fill="#ffd54f" stroke="#fff" stroke-width="3"/><text x="524" y="340" style="fill:#fff">25</text>
    <circle cx="500" cy="418" r="14" fill="#ffd54f" stroke="#fff" stroke-width="3"/><text x="524" y="428" style="fill:#fff">29</text>
    <circle cx="500" cy="462" r="14" fill="#ffd54f" stroke="#fff" stroke-width="3"/><text x="524" y="472" style="fill:#fff">31</text>
  </g>
  <!-- each label sits directly above its own wire -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <text x="345" y="136">红 3.3 V</text>
    <text x="345" y="312">黑 GND</text>
    <text x="345" y="400">蓝 SCL</text>
  </g>
  <!-- the green wire has no free gap above it (blue is 44 px up), so its label sits below it -->
  <text x="345" y="500" font-size="24" font-weight="700" text-anchor="middle">绿 SDA</text>
</svg></div></body></html>
